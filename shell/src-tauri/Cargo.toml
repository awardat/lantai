[package]
name = "lantai-shell"
version = "0.1.39"
description = "兰台（lantai）本地 RAG 知识库桌面壳：内嵌终端 + WebView 包装"
authors = ["lantai"]
edition = "2021"

[lib]
name = "lantai_shell_lib"
# 仅桌面端：不需要 cdylib（其导出 Windows 序号符号会触发 GNU ld 的
# "export ordinal too large" 链接错误），rlib 直接静态链接进主程序。
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# custom-protocol 必须显式启用：否则 tauri 处于 dev 模式，release 构建会加载 devUrl
# （http://localhost:1420）而非本地资产（tauri://），表现为"localhost 拒绝连接"。
# tauri CLI（tauri build）会自动注入该 feature；裸 cargo build 需手动声明。
tauri = { version = "2", features = ["devtools", "custom-protocol"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
webview2-com = "0.38.2"
windows-core = "0.61"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
